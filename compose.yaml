services:
  chargeos:
    build:
      context: .
    environment:
      CHARGEOS_OWNER_API_TOKEN: ${CHARGEOS_OWNER_API_TOKEN:?Set CHARGEOS_OWNER_API_TOKEN in .env}
      CHARGEOS_OWNER_TAGS: ${CHARGEOS_OWNER_TAGS:?Set CHARGEOS_OWNER_TAGS in .env}
      CHARGEOS_STATION_ID: ${CHARGEOS_STATION_ID:?Set CHARGEOS_STATION_ID in .env}
      CHARGEOS_STATION_SECRET: ${CHARGEOS_STATION_SECRET:?Set CHARGEOS_STATION_SECRET in .env}
    ports:
      - "9000:9000"
      - "9080:9080"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - chargeos-data:/data

volumes:
  chargeos-data:
