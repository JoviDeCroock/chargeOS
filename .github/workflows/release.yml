name: Publish attested container

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Validate release identity
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must be exact stable SemVer values such as v0.1.0" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" != "$version" ]]; then
            echo "package.json version $package_version does not match tag $RELEASE_TAG" >&2
            exit 1
          fi
          image="$REGISTRY/${SOURCE_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "candidate=$image:candidate-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source and release policy
        run: pnpm verify

      - name: Validate production deployment boundary
        run: pnpm verify:deployment

      - name: Reject production dependency advisories
        run: pnpm audit --prod

      - name: Authenticate to GHCR
        shell: bash
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin

      - name: Refuse an existing version tag
        shell: bash
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "Refusing to replace existing image tag $IMAGE:$VERSION" >&2
            exit 1
          fi

      - name: Build and push commit candidate
        id: candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          sbom: false
          tags: ${{ steps.release.outputs.candidate }}
          labels: |
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=chargeOS
            org.opencontainers.image.version=${{ steps.release.outputs.version }}

      - name: Exercise the exact registry candidate
        env:
          CHARGEOS_RUNTIME_IMAGE: ${{ steps.release.outputs.image }}@${{ steps.candidate.outputs.digest }}
        run: pnpm verify:runtime

      - name: Prepare release evidence directory
        run: mkdir -p release

      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          artifact-name: chargeos-${{ steps.release.outputs.version }}.cdx.json
          format: cyclonedx-json
          image: ${{ steps.release.outputs.image }}@${{ steps.candidate.outputs.digest }}
          output-file: release/chargeos-${{ steps.release.outputs.version }}.cdx.json
          syft-version: 1.50.0
          upload-release-assets: false

      - name: Create deterministic release manifest
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
          IMAGE: ${{ steps.release.outputs.image }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          node scripts/create-release-manifest.mjs \
            --digest "$DIGEST" \
            --image "$IMAGE" \
            --output "release/chargeos-$VERSION.manifest.json" \
            --repository "$SOURCE_REPOSITORY" \
            --revision "$SOURCE_REVISION" \
            --sbom "release/chargeos-$VERSION.cdx.json" \
            --version "$VERSION"

      - name: Attest image build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          subject-digest: ${{ steps.candidate.outputs.digest }}
          subject-name: ${{ steps.release.outputs.image }}

      - name: Attest image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          sbom-path: release/chargeos-${{ steps.release.outputs.version }}.cdx.json
          subject-digest: ${{ steps.candidate.outputs.digest }}
          subject-name: ${{ steps.release.outputs.image }}

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: chargeos-${{ steps.release.outputs.version }}-evidence
          path: release/
          retention-days: 90

      - name: Promote the tested and attested digest
        shell: bash
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            "$IMAGE@$DIGEST"
          published_digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r '.digest')"
          if [[ "$published_digest" != "$DIGEST" ]]; then
            echo "Published digest $published_digest does not match tested digest $DIGEST" >&2
            exit 1
          fi
