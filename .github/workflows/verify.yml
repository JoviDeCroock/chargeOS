name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Reject production dependency advisories
        run: pnpm audit --prod
      - name: Validate production Compose model
        run: pnpm verify:deployment
      - name: Validate production Caddy configuration
        run: |
          docker run --rm \
            --env CHARGEOS_ACME_EMAIL=owner@example.net \
            --env CHARGEOS_OCPP_DOMAIN=ocpp.example.net \
            --env CHARGEOS_OCPP_MAX_CONNECTIONS=8 \
            --env CHARGEOS_OWNER_DOMAIN=charge.example.net \
            --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Exercise the production runtime boundary
        run: pnpm verify:runtime
      - name: Exercise the separate company HTTPS Docker pilot
        run: pnpm verify:company-runtime
      - name: Verify AI relay credential redaction
        run: pnpm verify:ai-relay
      - name: Exercise the managed raw deployment template
        run: pnpm verify:managed-runtime
      - name: Generate deployed-image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          artifact-name: chargeos-container.cdx.json
          format: cyclonedx-json
          image: chargeos:local
          output-file: chargeos-container.cdx.json
          syft-version: 1.50.0
          upload-release-assets: false
      - name: Generate company account image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          artifact-name: chargeos-company-container.cdx.json
          format: cyclonedx-json
          image: chargeos-company:local
          output-file: chargeos-company-container.cdx.json
          syft-version: 1.50.0
          upload-release-assets: false
      - name: Generate company proxy image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          artifact-name: chargeos-company-proxy.cdx.json
          format: cyclonedx-json
          image: chargeos-company-proxy:local
          output-file: chargeos-company-proxy.cdx.json
          syft-version: 1.50.0
          upload-release-assets: false
